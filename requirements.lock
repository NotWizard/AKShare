# ============================================================================
#  requirements.lock —— 逐包精确锁（可复现安装）
#
#  生成方式（离线，只读当前环境，不联网）：
#    .venv312/bin/python -m pip list --format=freeze
#  然后取「requirements.txt 里 12 个直接依赖」的传递闭包（含 uvicorn[standard] 的
#  extras），逐行照抄实测版本。每一个 == 都来自 .venv312 里真实安装的包，无一编造。
#
#  环境快照：Python 3.12.14（.venv312；pyvenv.cfg 记 3.12.13）· macOS arm64
#  akshare==1.18.64 与 data/last_run.json 记录的采集版本一致。
#  （./.venv 是 Python 3.11.14 + akshare 1.18.67 的陈旧环境，不受支持，勿据此生成锁。）
#
#  安装：
#    .venv312/bin/python -m pip install -r requirements.lock
#    # 严格模式（闭包已完整，可禁止 pip 再解析）：加 --no-deps
#
#  无哈希说明：--hash 需要联网向 PyPI 取每个 wheel/sdist 的摘要，本仓当前离线，
#  无法生成，故不写哈希，也不伪造。有网环境请用 `pip hash <file>` 或
#  `uv pip compile requirements.txt --generate-hashes -o requirements.lock` 补齐。
#
#  下列 32 个包也装在 .venv312 里，但不在上述闭包内，故不写入本锁文件（残留：已下线
#  的 legacy Dash/Plotly 栈、另一套行情库 tushare、akshare 1.18 已不再声明的
#  matplotlib 绘图链，以及 pip/setuptools 构建工具）——可安全卸载，与本项目无关：
#    blinker bs4 contourpy cycler dash dash-bootstrap-components dill diskcache
#    Flask fonttools importlib_metadata itsdangerous janus Jinja2 kiwisolver
#    MarkupSafe matplotlib multiprocess narwhals nest-asyncio pillow pip plotly
#    psutil pyparsing retrying setuptools simplejson tushare websocket-client
#    Werkzeug zipp
