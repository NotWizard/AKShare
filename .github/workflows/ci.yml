name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (pytest + pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # requirements.txt is the single authoritative dependency list and already
      # pins pytest + httpx (needed by fastapi.testclient), so no extra installs.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No real DB on CI: backend/tests/conftest.py seeds the committed fixtures
      # under backend/tests/fixtures/ into data/ so the DB-backed tests run.
      - name: Run backend tests
        run: python -m pytest backend/tests -q

      # Fully self-contained (temp dirs, no network, no real DB).
      - name: Run pipeline verification
        run: python scripts/_pipeline_test.py

  frontend:
    name: frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci hung ~8min then crashed ("Exit handler never called") on the runner:
      # a postinstall lifecycle script (esbuild/vue-demi) stalling on a network fetch.
      # --ignore-scripts skips them; safe here because the esbuild/rollup native
      # binaries come from platform optionalDependencies in the lockfile, not the
      # postinstalls (verified: with all postinstalls blocked, typecheck+vitest+build
      # still pass). --no-audit/--no-fund drop extra registry round-trips.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      # Logic regressions (client retry/dedupe/token replay, SSE parsing, store
      # state, chart builders) fail here before the slower build runs.
      - name: Unit tests
        working-directory: frontend
        run: npm run test:run

      - name: Build
        working-directory: frontend
        run: npm run build
